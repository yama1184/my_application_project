献立アプリ 開発指示書（MVP＋将来拡張）
1. 概要

     アプリ名（仮）：
         スマート献立

     目的：

         忙しい家庭や料理初心者が簡単に献立を決められるようにする

         食材の無駄を減らし、買い物の効率化を実現

         家族共有で食事管理とコミュニケーションを促進

     ターゲットユーザー：

         20〜50代主婦、料理初心者

    課題：
         献立考案の負担、食材の無駄、アレンジの難しさ

2. コア機能（MVP）
    2.1 食材から献立提案

     入力方法：

         食材リストから選択

         テキスト入力可能

         よく使う食材はメモリ機能で登録

     献立提案：

         複数品数で「できるだけ入力食材を使用」

         メイン＋サブで5パターン提案

         「追加表示」ボタンで3パターンずつ追加

         足りない食材を補う場合は「揃っている食材の％表示」

     人数設定：

        提案前に人数入力

        食材必要量自動計算

        カロリー表示：一食あたり

    2.2 買い物リスト

     献立に必要な食材自動追加

     食材のグループ分け：

         主食、肉、魚、野菜、調味料、乳製品・卵、その他

         スーパーマーケットの棚イメージで表示

ストック機能：

常備食材が不足した時点で自動追加

操作：

チェックボックスで購入済み管理

手動追加・削除可能

グループ順で一覧表示

2.3 1か月献立表（有料）

期間指定可能：3日〜1か月

カレンダー形式で表示

日付変更可能

買い物タイミング設定：毎日、3日に1回、1週間

2.4 コミュニティ機能（有料）

投稿・質問・アレンジアイデアの共有

イベントやトピック提供

誹謗中傷対策の運営機能

2.5 画像アップ（有料）

ユーザー投稿

AI点数評価＋ポイント付与

AI生成画像判定機能

著作権放棄規約同意

2.6 絞り込み機能（有料）

「時短」「節約」「健康」など

パーソナライズ献立提案

2.7 家族共有機能

1アカウント最大5人

献立・買い物リスト共有

個別評価・コメント

個別好み学習AIによるパーソナライズ

3. マネタイズ

無料：買い物リスト、食材から献立提案

月額課金：

1か月献立表

画像アップ

コミュニティ機能

絞り込み機能

広告非表示

パーソナライズ機能（アレルギー対応・カロリー計算・高度レシピ分析）

